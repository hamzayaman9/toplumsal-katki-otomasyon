[project]
name = "katki"
version = "0.1.0"
description = "Ankara Üniversitesi Toplumsal Katkı Koordinatörlüğü için haber tarama ve sınıflandırma sistemi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "playwright>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
katki = "katki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
