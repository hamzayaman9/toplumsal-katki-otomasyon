<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Toplumsal Katkı Paneli</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --border: rgba(11, 11, 11, 0.10); --series-1: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --border: rgba(255, 255, 255, 0.10); --series-1: #3987e5; --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --border: rgba(255, 255, 255, 0.10); --series-1: #3987e5; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  p { color: var(--ink-2); font-size: 13px; margin: 0 0 16px; }
  input, button {
    font: inherit; width: 100%; border-radius: 8px; padding: 9px 10px;
  }
  input { color: var(--ink); background: var(--page); border: 1px solid var(--border); margin-bottom: 10px; }
  button { border: 0; background: var(--series-1); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .hata { color: var(--critical); font-size: 13px; min-height: 1.45em; margin-top: 8px; }
</style>
</head>
<body>
<form id="f">
  <h1>Toplumsal Katkı Paneli</h1>
  <p>Devam etmek için panel şifresini girin.</p>
  <input id="sifre" type="password" autocomplete="current-password" aria-label="Şifre" placeholder="Şifre" required autofocus>
  <button type="submit">Giriş</button>
  <div class="hata" id="hata" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  document.getElementById("hata").textContent = "";
  try {
    const r = await fetch("/giris", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sifre: document.getElementById("sifre").value }),
    });
    if (r.ok) { location.href = "/"; return; }
    document.getElementById("hata").textContent = r.status === 401 ? "Şifre yanlış." : "Bir sorun oluştu, tekrar deneyin.";
  } catch {
    document.getElementById("hata").textContent = "Sunucuya ulaşılamadı.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
